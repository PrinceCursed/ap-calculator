<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="BLOODS">
  <defs>
    <clipPath id="tile"><rect width="100" height="100" rx="25"/></clipPath>
    <radialGradient id="halo" cx="55%" cy="46%">
      <stop offset=".36" stop-color="#ff151d" stop-opacity="0"/>
      <stop offset=".59" stop-color="#ff151d" stop-opacity=".85"/>
      <stop offset=".75" stop-color="#ff151d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff151d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare">
      <stop stop-color="#fff"/>
      <stop offset=".12" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".4" stop-color="#ff151d" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ff151d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x2=".88" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ff151d" stop-opacity=".12"/>
      <stop offset=".39" stop-color="#ff151d"/>
      <stop offset=".52" stop-color="#fff"/>
      <stop offset=".67" stop-color="#ff151d"/>
      <stop offset="1" stop-color="#ff151d" stop-opacity=".45"/>
    </linearGradient>
    <filter id="soft" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="wisp" x="-.5" y="-.5" width="2" height="2">
      <feTurbulence type="fractalNoise" baseFrequency=".075 .13" numOctaves="3" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="#030305"/>
    <ellipse cx="50" cy="51" rx="55" ry="54" fill="url(#halo)"/>
    <circle cx="51" cy="51" r="35" fill="none" stroke="#ff151d" stroke-width="8" opacity=".59" filter="url(#wisp)"/>
    <circle cx="50" cy="51" r="31" fill="none" stroke="#ff151d" stroke-width="8" filter="url(#soft)"/>
    <circle cx="50" cy="51" r="30" fill="#010102" stroke="url(#rim)" stroke-width="2.5"/>
    <ellipse cx="72" cy="30" rx="22" ry="18" fill="url(#flare)" transform="rotate(36 72 30)"/>
    <path d="M66 25q6 4 10 11" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.3" stroke-linecap="round"/>
    <text x="50" y="51" dy=".34em" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="21" textLength="91" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#08080a" stroke-opacity=".7" stroke-width="2.1" stroke-linejoin="round" paint-order="stroke">BLOODS</text>
  </g>
</svg>
